services:
  # Trading Agent Backend (FastAPI)
  backend:
    build: ./backend
    container_name: trader-backend
    ports:
      - "8000:8000"
    environment:
      - IB_HOST=host.docker.internal # Connect to TWS on host
      - IB_PORT=7497 # Paper trading port
      # Market Data Type:
      # 1=Live, 2=Frozen, 3=Delayed, 4=Delayed Frozen
      # Use 3 or 4 for free/paper accounts without subscriptions.
      - IB_MARKET_DATA_TYPE=1
      # TRADING_MODE: live or simulation

      - POSTGRES_SERVER=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=trader
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
    dns:
      - 8.8.8.8 # Often needed for IBKR connection stability
    # Mount code for hot reloading
    volumes:
      - ./backend:/app
      - ./history:/app/history

  # User Interface (Streamlit)
  frontend:
    build: ./frontend
    container_name: trader-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    # Mount code for hot reloading
    volumes:
      - ./frontend:/app

  # Database (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: trader-db
    # ports:
    # - "5433:5432" # Removed to avoid ALL port conflicts. Backend connects internally.
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=trader
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
